# MAYOTIX OS System Configuration
#
# Base system configuration for MAYOTIX OS Phase 1

# Hostname
HOSTNAME=mayotix
PRETTY_HOSTNAME="MAYOTIX OS"

# System timezone (user-configurable during install)
TIMEZONE=UTC

# Kernel command line defaults
KERNEL_CMDLINE="security=selinux selinux=1 enforcing=1 console=tty0"

# SELinux configuration
SELINUX=enforcing
SELINUXTYPE=mayotix

# Firewall
FIREWALL_ENABLED=yes
FIREWALL_ZONE=public

# Network
NETWORKING=yes
IPV6INIT=yes

# Security
AUDIT_ENABLED=yes
AUDIT_BACKLOG_LIMIT=8192

# System updates
UPDATE_CHECK_ENABLED=yes
UPDATE_CHECK_INTERVAL=86400

# Telemetry (disabled by default)
TELEMETRY_ENABLED=no
TELEMETRY_COLLECTION=no

# Privacy
CRASH_REPORT_ENABLED=no
ERROR_REPORTING=no

# Locale (user-configurable)
LANG=en_US.UTF-8
LC_ALL=en_US.UTF-8

# Console
FONT=ter-u16n
KEYMAP=us

# First boot
FIRST_BOOT=yes
FIRST_BOOT_WIZARD=yes
