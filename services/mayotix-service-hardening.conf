#!/bin/bash
# Core systemd hardening defaults for MAYOTIX OS services
#
# This file provides systemd hardening directives that all MAYOTIX services
# should inherit. Individual services can override as needed.

[Unit]
After=network-online.target
Wants=network-online.target
ConditionVirtualization=!container

[Service]
### Restart policy
Restart=on-failure
RestartSec=10s
StartLimitInterval=60s
StartLimitBurst=3

### Timeout
TimeoutStartSec=30s
TimeoutStopSec=30s

### Process management
Type=simple
KillMode=mixed
KillSignal=SIGTERM
FinalKillSignal=SIGKILL
SendSigKill=yes

### User/Group (override per service)
User=root
Group=root

### Security isolation - Filesystem
PrivateTmp=yes
PrivateDevices=yes
ProtectSystem=strict
ProtectHome=yes
ProtectKernelTunables=yes
ProtectKernelModules=yes
ProtectControlGroups=yes
ProtectClock=yes
ProtectHostname=yes
LockPersonality=yes
PrivateUsers=no

### Capabilities and privileges
NoNewPrivileges=yes
CapabilityBoundingSet=CAP_NET_BIND_SERVICE
AmbientCapabilities=
SecureBits=keep-caps keep-caps-locked nosetuid-fixed nosetuid-fixed-locked no-cap-ambient-raise no-cap-ambient-raise-locked

### System call filtering
RestrictAddressFamilies=AF_UNIX AF_INET AF_INET6
RestrictNamespaces=yes
RestrictRealtime=yes
RestrictSUIDSGID=yes
RemoveIPC=yes

### Resource limits
LimitNOFILE=65535
LimitNPROC=512

### Cgroup management
CPUAccounting=yes
MemoryAccounting=yes
TasksAccounting=yes
IOAccounting=yes

### Security context
SystemCallErrorNumber=EPERM
System CallFilter=~@clock @debug @module @mount @obsolete @privileged @raw-io @reboot @swap @system-service @tracing

### Logging
StandardOutput=journal
StandardError=journal
SyslogIdentifier=%n

### Device access
PrivateDevices=yes
DevicePolicy=closed

### Read-only paths (can be extended per service)
ReadOnlyPaths=/sys /proc /dev/null

### Temporary directory
PrivateTmp=yes
TemporaryFileSystem=/tmp:size=1G:nodev,noexec,nosuid

### Environment
EnvironmentFile=-/etc/default/%n
EnvironmentFile=-/etc/mayotix/security.conf

### Debugging (comment out in production)
# Environment="RUST_LOG=debug"
# StandardOutput=console
