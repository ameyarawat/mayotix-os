#!/bin/bash
# Dracut configuration for MAYOTIX OS
#
# Dracut generates the initial ramdisk (initramfs) that runs before the main kernel.
# This configuration includes:
# - LUKS2 encryption support
# - SELinux policy
# - Device management
# - Minimal boot environment

### Modules to include in initramfs
# Note: 'crypt' is the dracut module name (not 'cryptsetup')
# Only include modules that are available on the build system
add_dracutmodules+=" crypt "
add_dracutmodules+=" dm "
add_dracutmodules+=" selinux "
add_dracutmodules+=" systemd "
add_dracutmodules+=" base "

### Modules to exclude
omit_dracutmodules+=" nfs nbd iscsi multipath "

### Kernel modules to include
add_drivers+=" ext4 "
add_drivers+=" dm-crypt "

### Hostonly mode (disabled for generic ISO builds)
hostonly="no"

### Kernel command line parameters
kernel_cmdline="security=selinux selinux=1 enforcing=1"

### Compression (xz for smaller initramfs)
compress="xz"

### Standard environment
tmpdir="/tmp"

### Firmware files
include_firmware="yes"

### UUID/LABEL mapping for LUKS
# This will be auto-detected in /etc/crypttab

