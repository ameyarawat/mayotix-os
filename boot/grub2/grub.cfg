### GRUB2 Configuration for MAYOTIX OS
###
### This bootloader configuration provides:
### - UEFI + BIOS boot support
### - Secure Boot compatibility
### - LUKS2 encrypted root detection
### - SELinux enforcing mode
### - Secure defaults

### Boot timeout (seconds before default entry)
set timeout=10
set timeout_style=menu

### Default entry
set default=0

### LUKS2 encryption support
insmod gzio
insmod part_gpt
insmod part_msdos
insmod ext2
insmod cryptodisk
insmod luks2

### Detect LUKS2 encrypted partitions
search --set=root --label MAYOTIX_ROOT

### Enable serial console for debugging (comment out for normal boot)
# serial --unit=0 --speed=115200
# terminal_input serial console
# terminal_output serial console

### Main menu entry - MAYOTIX OS (encrypted)
menuentry 'MAYOTIX OS (Encrypted)' {
    insmod gzio
    insmod part_gpt
    insmod cryptodisk
    insmod luks2
    insmod ext2

    # Unlock LUKS2 partition
    cryptomount -u MAYOTIX_ROOT
    set root='cryptouuid/MAYOTIX_ROOT'

    # Load kernel with security parameters
    echo 'Loading kernel...'
    linux /vmlinuz root=/dev/mapper/MAYOTIX_ROOT ro \
        security=selinux selinux=1 enforcing=1 \
        console=tty0 console=ttyS0,115200n8

    # Load initramfs
    echo 'Loading initial ramdisk...'
    initrd /initrd.img
}

### Recovery entry - MAYOTIX OS (single-user mode)
menuentry 'MAYOTIX OS (Recovery - Single User)' {
    insmod gzio
    insmod part_gpt
    insmod cryptodisk
    insmod luks2
    insmod ext2

    cryptomount -u MAYOTIX_ROOT
    set root='cryptouuid/MAYOTIX_ROOT'

    echo 'Loading kernel (recovery mode)...'
    linux /vmlinuz root=/dev/mapper/MAYOTIX_ROOT ro \
        security=selinux selinux=0 \
        single console=tty0 console=ttyS0,115200n8

    initrd /initrd.img
}

### Fallback - Boot from first disk without encryption (for recovery)
menuentry 'MAYOTIX OS (Unencrypted - Emergency Only)' {
    insmod gzio
    insmod part_gpt
    insmod ext2

    set root='hd0,gpt3'
    echo 'Loading kernel (unencrypted - emergency mode)...'
    linux /vmlinuz root=/dev/sda3 ro \
        security=selinux selinux=0 \
        single console=tty0 console=ttyS0,115200n8

    initrd /initrd.img
}

### UEFI Secure Boot support
if [ "${grub_platform}" = "efi" ]; then
    echo "UEFI Secure Boot detected"
    # Secure Boot will verify grub.efi signature
fi

