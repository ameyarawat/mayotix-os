# MAYOTIX OS Phase 5 Week 1: Hardened System-wide Encrypted DNS (DNS-over-TLS / DoT)
#
# Location: /etc/systemd/resolved.conf.d/mayotix-dot.conf
# Description: Enforces strict DNS-over-TLS (DoT) on port 853 with DNSSEC validation,
#              disables unencrypted legacy protocols (mDNS, LLMNR), and routes all
#              DNS resolution through verified privacy-respecting resolvers.

[Resolve]
# Primary Trusted Privacy Resolvers (IPv4 and IPv6 with TLS SNI validation hostnames)
# Quad9 (Malware blocking & privacy), Mullvad (No-log privacy), Cloudflare (High availability)
DNS=9.9.9.9#dns.quad9.net 149.112.112.112#dns.quad9.net 194.242.2.3#dns.mullvad.net 1.1.1.1#cloudflare-dns.com 2620:fe::fe#dns.quad9.net 2a07:e340::3#dns.mullvad.net 2606:4700:4700::1111#cloudflare-dns.com

# Fallback Encrypted DNS Resolvers
FallbackDNS=1.0.0.1#cloudflare-dns.com 194.242.2.4#dns.mullvad.net 2620:fe::9#dns.quad9.net 2606:4700:4700::1001#cloudflare-dns.com

# Enforce strict DNS-over-TLS (yes = require TLS on port 853; query fails if TLS cannot be established)
DNSOverTLS=yes

# Enforce DNSSEC Validation (allow-downgrade validates DNSSEC signed zones while supporting non-signed zones)
DNSSEC=allow-downgrade

# Route all DNS traffic through configured global resolvers (routing domain wildcard)
Domains=~.

# Disable local broadcast name resolution protocols to prevent network metadata leakage and poisoning attacks
MulticastDNS=no
LLMNR=no

# Enable secure local DNS caching
DNSCache=yes
CacheFromLocalhost=no

# Parse local /etc/hosts for static resolution
ReadEtcHosts=yes
