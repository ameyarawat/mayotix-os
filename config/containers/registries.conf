# MAYOTIX OS Hardened Container Registries Configuration
# Default policy: Explicit whitelist, block unencrypted HTTP, enforce TLS

[registries.search]
registries = ['docker.io', 'quay.io', 'ghcr.io', 'registry.fedoraproject.org']

[registries.insecure]
registries = []

[registries.block]
registries = []

# Enforce secure transport for all registry interactions
unqualified-search-registries = ["docker.io", "quay.io", "ghcr.io"]

[[registry]]
prefix = "docker.io"
location = "docker.io"
insecure = false
blocked = false

[[registry]]
prefix = "quay.io"
location = "quay.io"
insecure = false
blocked = false

[[registry]]
prefix = "ghcr.io"
location = "ghcr.io"
insecure = false
blocked = false
