# MAYOTIX OS Phase 3 Week 2: Flatpak Hardened Configuration
# Default override profile that disables access to host filesystem, host IPC, and X11 by default,
# enforcing Wayland-only display socket.

[Context]
# Disable access to host filesystem (except for allowed paths below)
# We'll restrict to the flatpak runtime and the app's own directories.
# The following lines disable various host accesses.
# Filesystem
host=false
# Devices
devices=false
# Socket access to X11 is blocked
socket=x11=false
# Socket access to wayland is allowed (we'll enable the wayland socket)
socket=wayland=true
# Socket access to pulseaudio is allowed if needed, but we can restrict
socket=pulseaudio=false
# Socket access to session bus is allowed
socket=session-bus=true
# Socket access to system bus is restricted (we can allow specific services if needed)
socket=system-bus=false
# Network access is allowed (apps need network for updates, etc.)
network=true
# IPC is allowed (for communication with the sandbox host? We'll restrict host IPC)
ipc=false
# Allow the app to execute only its own binaries (no host execution)
noexec=false
# Allow writing to the homedir (but we can restrict to the app's data)
# We'll rely on flatpak's own permissions for homedir access.
# For now, we keep the default (which allows access to the homedir).
# We can tighten this with [Context] options like host-hostname=false, etc.
# But we'll keep it simple and rely on the fact that the app is confined to its runtime.
# Additional restrictions:
# We can also set:
#   talkname=ca.desrt.dconf=false   # Disable access to dconf if not needed
#   talkname=org.freedesktop.Flatpak=false   # Disable talking to flatpak host if not needed
# However, we'll leave those to the specific app manifests if needed.

# We can also set:
#   noautoprovide=true   # Do not automatically provide extensions
# But we'll leave it to the app.

# End of file